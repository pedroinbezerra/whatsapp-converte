services:
  vite-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_GET_CLICKS: ${VITE_GET_CLICKS}
        VITE_GET_CHANGELOG: ${VITE_GET_CHANGELOG}
        VITE_ADD_CLICK: ${VITE_ADD_CLICK}
        VITE_API_KEY: ${VITE_API_KEY}
    ports:
      - "4173:4173" # Mapeia a porta 4173 do contêiner para a máquina host
    command: [ "npm", "run", "preview", "--", "--host" ]
    env_file:
      - .env
    environment:
      NODE_ENV: production
